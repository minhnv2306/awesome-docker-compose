# /etc/logstash/conf.d/sensitive.conf
# Config để xử lý log có thông tin nhạy cảm

input {
  beats {
    port => 5045  # Port khác với laravel.conf để tránh conflict
  }
}

filter {
  # Parse log Laravel format với thông tin nhạy cảm  
  # [2025-10-18 10:35:04] laravel.ALERT: Sensitive Info Alert {...}
  grok {
    match => {
      "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{WORD:env}\.%{LOGLEVEL:level}: Sensitive Info Alert %{GREEDYDATA:json_data}"
    }
    add_field => { "grok_matched" => "true" }
    tag_on_failure => ["_grokparsefailure"]
  }



  # Parse JSON data chứa thông tin nhạy cảm  
  if [json_data] {
    json {
      source => "json_data"
      skip_on_invalid_json => true
    }
  }

  # Convert field types đúng cách
  if [rt] {
    mutate {
      convert => { "rt" => "float" }
    }
  }
  
  if [st] {
    mutate {
      convert => { "st" => "integer" }
    }
  }

  # Chuyển timestamp về dạng date chuẩn
  date {
    match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
    timezone => "Asia/Ho_Chi_Minh"
  }

  # Xử lý thông tin nhạy cảm - Mask/Hash sensitive data
#   if [uid] {
#     # Hash user ID để bảo mật
#     fingerprint {
#       source => ["uid"]
#       target => "user_hash"
#       method => "SHA256"
#       key => "your_secret_key_here"
#     }
#     # Xóa uid gốc
#     mutate {
#       remove_field => ["uid"]
#     }
#   }

  if [cip] {
    # Mask IP address - chỉ giữ lại 3 octet đầu
    mutate {
      gsub => ["cip", "\.\d+$", ".xxx"]
    }
  }

  if [ua] {
    # Rút gọn User Agent để tránh fingerprinting
    mutate {
      gsub => ["ua", "/\d+\.\d+\.\d+", "/x.x.x"]
    }
  }

  # Thêm classification cho log sensitive
  mutate {
    add_field => { 
      "log_classification" => "sensitive"
      "retention_policy" => "30_days"
      "access_level" => "restricted"
    }
  }

  # Clean up - xóa các field không cần thiết, giữ lại tất cả JSON fields
  mutate {
    remove_field => ["agent", "ecs", "input", "log", "json_data", "@version"]
    # Giữ lại: lt, url, urp, urq, rt, st, mt, rf, rmip, tl, host, cip, ua, uid, tags, rqb, xcs, xss
  }
}

output {
  # Lưu vào index riêng cho sensitive logs
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "sensitive-logs-%{+YYYY.MM.dd}"
    # user => "elastic"
    # password => "your_password"
  }

  # Dead letter queue cho các log không parse được
  if "_grokparsefailure" in [tags] or "_jsonparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://localhost:9200"]
      index => "failed-sensitive-logs-%{+YYYY.MM.dd}"
    }
  }

  # Console output cho debug (tắt để production)
  # stdout { 
  #   codec => rubydebug {
  #     metadata => false
  #   }
  # }
}